<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Taylor Swift Song Ranker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <div>
        <h1>Taylor Swift Song Ranker</h1>
        <p class="lead">Give your favorite songs cute rankings — drag, drop, and share.</p>
      </div>
      <div class="brand">💖</div>
    </header>

    <div class="controls">
      <button id="load-default">Load default</button>
      <button id="save">Save</button>
      <button id="pairwise">Pairwise rank</button>
      <button id="share">Share</button>
      <button id="export-json">Export JSON</button>
      <button id="export-csv">Export CSV</button>
      <label class="import-label">
        Import
        <input id="import-file" type="file" accept="application/json" hidden />
      </label>
      <div class="auto-save-indicator" id="auto-save-indicator">
        <span class="save-status">Auto-save: ON</span>
      </div>
    </div>

    <!-- Song List -->
    <div class="song-list-container">
      <h2>Your Songs</h2>
      <ul id="song-list" class="song-list">
        <!-- Songs will be populated here -->
      </ul>
    </div>

    <!-- Ranked Preview -->
    <div class="ranked-preview" style="margin-top: 20px;">
      <h3>Current Ranking</h3>
      <ol id="ranked-list" class="ranked-list">
        <!-- Ranked songs will be shown here -->
      </ol>
    </div>

    <div class="footer">
      <small>Tip: drag to reorder, double-click to rename, or use keyboard: focus + Up/Down to move.</small>
    </div>
  </main>

  <!-- decorative stickers for girly-glam theme -->
  <div class="stickers" aria-hidden="true">
    <img class="sticker" src="stickers/sticker-heart.svg" alt="" />
    <img class="sticker" src="stickers/sticker-star.svg" alt="" />
    <img class="sticker" src="stickers/sticker-music.svg" alt="" />
  </div>

  <div data-pairwise="overlay" style="display:none">
    <div class="pairwise-panel">
      <div class="pair-tile" id="pair-left"></div>
      <div class="pair-controls">
        <div class="pair-counter" id="pair-counter">Comparisons: 0</div>
        <div class="pair-progress-wrap" id="pair-progress-wrap"><div class="pair-progress" id="pair-progress" style="width:0%" aria-valuenow="0"></div></div>
        <div class="pair-hint" id="pair-hint">Press 1 for left, 2 for right, Esc to cancel</div>
        <button class="pair-action" id="pair-cancel">Cancel</button>
      </div>
      <div class="pair-tile" id="pair-right"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
